[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeral-lora-proxy"
version = "0.1.0"
description = "Ephemeral Weight Consolidation Proxy & LoRA Sidecar for llama.cpp on AMD Strix Halo"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Lawrence Kincheloe", email = "lokimail@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
rocm = [
    "torch",
    "peft",
    "transformers",
]
